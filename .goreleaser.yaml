version: 2

# Pinned so release assets stay drip_<version>_<os>_<arch>.tar.gz regardless of
# the repository or checkout directory name. The installers match on that name.
project_name: drip

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/drip
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    # No mips targets: the control plane pulls in modernc.org/sqlite, whose
    # modernc.org/libc dependency has no mips, mipsle, mips64 or mips64le build
    # files, so every one of those targets fails to compile.
    goarch:
      - "386"
      - arm
      - amd64
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Tag }} -X main.GitCommit={{ .Commit }} -X main.BuildTime={{ .Date }}

archives:
  - formats: [tar.gz]

release:
  # auto marks a release as a pre-release only when the tag carries a suffix
  # such as -rc1. Marking every release as one hides it from the
  # /releases/latest API, which is what the installers query.
  prerelease: auto
  # Keep the release notes a human already wrote; mode only governs the body,
  # the binaries are uploaded either way.
  mode: keep-existing
