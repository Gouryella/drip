services:
  drip-server:
    image: drip-server:${VERSION:-latest}
    build:
      context: ..
      dockerfile: deployments/Dockerfile.server
      args:
        VERSION: ${VERSION:-dev}
    container_name: drip-server
    restart: unless-stopped
    ports:
      - "443:443"
      - "20000-20100:20000-20100"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./certs:/app/certs:ro
